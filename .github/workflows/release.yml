name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate tag and project version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_TYPE" == tag ]] || {
            printf 'Run this workflow from a v* tag.\n' >&2
            exit 1
          }
          version=${GITHUB_REF_NAME#v}
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            printf 'Tag must be a semantic version: %s\n' "$GITHUB_REF_NAME" >&2
            exit 1
          }
          package_version=$(cargo metadata --no-deps --format-version 1 | \
            jq -r '.packages[] | select(.name == "paperoll") | .version')
          [[ $version == "$package_version" ]] || {
            printf 'Tag version %s does not match Cargo.toml version %s\n' \
              "$version" "$package_version" >&2
            exit 1
          }
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.platform }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: macos-aarch64
            format: app
            platform: macos
            runner: macos-15
            target: aarch64-apple-darwin
          - artifact: macos-x86_64
            format: app
            platform: macos
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - artifact: windows-x86_64
            format: nsis
            platform: windows
            runner: windows-2025
            target: x86_64-pc-windows-msvc
          - artifact: linux-x86_64
            format: appimage
            platform: linux
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    environment:
      name: release
    env:
      CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY }}
      CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD }}
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Enable long paths on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore Rust release cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: rust-${{ matrix.target }}
          lookup-only: true

      - name: Select macOS SDK
        if: runner.os == 'macOS'
        shell: bash
        run: echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"

      - name: Import Developer ID certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$APPLE_CERTIFICATE_P12_BASE64"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          certificate_path="$RUNNER_TEMP/paperoll-developer-id.p12"
          keychain_path="$RUNNER_TEMP/paperoll-signing.keychain-db"
          keychain_password=$(openssl rand -hex 32)
          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          signing_identity=$(security find-identity -v -p codesigning "$keychain_path" | \
            sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)
          test -n "$signing_identity"
          printf 'APPLE_SIGNING_IDENTITY=%s\n' "$signing_identity" >> "$GITHUB_ENV"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential clang cmake libasound2-dev libfontconfig-dev \
            libglib2.0-dev libssl-dev libva-dev libvulkan1 libwayland-dev \
            libx11-xcb-dev libxkbcommon-x11-dev libzstd-dev

      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install nsis --yes --no-progress

      - name: Install cargo-packager
        shell: bash
        run: command -v cargo-packager || cargo install cargo-packager --version 0.11.8 --locked

      - name: Build release binary
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          cargo build --release --locked --target "$BUILD_TARGET"

      - name: Package and sign update
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          BUILD_FORMAT: ${{ matrix.format }}
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          test -n "$CARGO_PACKAGER_SIGN_PRIVATE_KEY"
          test -n "$CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD"
          cargo packager \
            --formats "$BUILD_FORMAT" \
            --release \
            --target "$BUILD_TARGET" \
            --binaries-dir "target/$BUILD_TARGET/release" \
            --out-dir release-assets

      - name: Sign and notarize macOS app
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$APPLE_API_KEY_ID"
          test -n "$APPLE_API_ISSUER_ID"
          test -n "$APPLE_API_PRIVATE_KEY_BASE64"
          app="release-assets/Paperoll.app"
          notarization_archive="$RUNNER_TEMP/Paperoll-notarization.zip"
          api_key="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
          updater_archive="release-assets/Paperoll.app.tar.gz"
          dmg_staging=$(mktemp -d "$RUNNER_TEMP/Paperoll-dmg.XXXXXX")
          dmg="release-assets/Paperoll.dmg"
          test -d "$app"
          printf '%s' "$APPLE_API_PRIVATE_KEY_BASE64" | base64 --decode > "$api_key"
          chmod 600 "$api_key"
          codesign \
            --deep \
            --force \
            --options runtime \
            --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" \
            "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          ditto -c -k --keepParent "$app" "$notarization_archive"
          xcrun notarytool submit "$notarization_archive" \
            --key "$api_key" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait \
            --timeout 1h
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=4 "$app"
          rm -f "$updater_archive" "$updater_archive.sig"
          tar -C release-assets -czf "$updater_archive" Paperoll.app
          cargo packager signer sign "$updater_archive"

          ditto "$app" "$dmg_staging/Paperoll.app"
          ln -s /Applications "$dmg_staging/Applications"
          hdiutil create \
            -volname Paperoll \
            -srcfolder "$dmg_staging" \
            -format UDZO \
            -ov \
            "$dmg"
          codesign \
            --force \
            --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" \
            "$dmg"
          codesign --verify --verbose=2 "$dmg"
          xcrun notarytool submit "$dmg" \
            --key "$api_key" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait \
            --timeout 1h
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          hdiutil verify "$dmg"
          dmg_mount=$(mktemp -d "$RUNNER_TEMP/Paperoll-mounted.XXXXXX")
          hdiutil attach -nobrowse -readonly -mountpoint "$dmg_mount" "$dmg"
          codesign --verify --deep --strict --verbose=2 "$dmg_mount/Paperoll.app"
          spctl --assess --type execute --verbose=4 "$dmg_mount/Paperoll.app"
          xcrun stapler validate "$dmg_mount/Paperoll.app"
          hdiutil detach "$dmg_mount"

      - name: Remove temporary macOS signing keychain
        if: runner.os == 'macOS' && always()
        shell: bash
        run: security delete-keychain "$RUNNER_TEMP/paperoll-signing.keychain-db" || true

      - name: Normalize update filenames
        shell: bash
        env:
          ARTIFACT: ${{ matrix.artifact }}
          BUILD_FORMAT: ${{ matrix.format }}
        run: |
          set -euo pipefail
          mkdir -p upload
          case "$BUILD_FORMAT" in
            app)
              source=$(find release-assets -maxdepth 1 -name '*.app.tar.gz' -print -quit)
              destination="upload/Paperoll-$VERSION-$ARTIFACT.app.tar.gz"
              ;;
            nsis)
              source=$(find release-assets -maxdepth 1 -name '*setup*.exe' -print -quit)
              destination="upload/Paperoll-$VERSION-$ARTIFACT-setup.exe"
              ;;
            appimage)
              source=$(find release-assets -maxdepth 1 -name '*.AppImage' -print -quit)
              destination="upload/Paperoll-$VERSION-$ARTIFACT.AppImage"
              ;;
          esac
          test -n "$source"
          test -f "$source.sig"
          mv "$source" "$destination"
          mv "$source.sig" "$destination.sig"
          if [[ "$BUILD_FORMAT" == app ]]; then
            dmg="release-assets/Paperoll.dmg"
            test -f "$dmg"
            mv "$dmg" "upload/Paperoll-$VERSION-$ARTIFACT.dmg"
          fi

      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Paperoll-${{ matrix.artifact }}
          path: upload/Paperoll-*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs:
      - validate
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: Paperoll-*
          path: release-assets
          merge-multiple: true

      - name: Create checksums
        working-directory: release-assets
        run: sha256sum Paperoll-* | grep -v '\.sig$' > SHA256SUMS

      - name: Create signed update manifest
        run: |
          ./scripts/create-update-manifest.sh \
            "$VERSION" \
            "$GITHUB_REPOSITORY" \
            release-assets \
            release-assets/latest.json
          jq -e '
            .platforms["macos-aarch64"] and
            .platforms["macos-x86_64"] and
            .platforms["windows-x86_64"] and
            .platforms["linux-x86_64"]
          ' release-assets/latest.json >/dev/null

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Paperoll $VERSION" \
            --generate-notes \
            release-assets/*
