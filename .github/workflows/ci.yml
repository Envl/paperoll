name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check formatting
        run: cargo fmt --all -- --check

  test:
    name: Test (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            runner: macos-15
            target: aarch64-apple-darwin
          - platform: Windows
            runner: windows-2025
            target: x86_64-pc-windows-msvc
          - platform: Linux
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Enable long paths on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: rust-${{ matrix.target }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential clang cmake libasound2-dev libfontconfig-dev \
            libglib2.0-dev libssl-dev libva-dev libvulkan1 libwayland-dev \
            libx11-xcb-dev libxkbcommon-x11-dev libzstd-dev

      - name: Run tests
        if: runner.os == 'Linux'
        run: cargo test --locked

      - name: Run Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Check platform compilation
        if: runner.os != 'Linux'
        run: cargo check --all-targets --locked
