[package]
name = "paperoll"
version = "0.1.0"
edition = "2024"
publish = false
description = "A native scratchpad made of persistent rolls of syntax-highlighted snippets"
license = "GPL-3.0-or-later"
repository = "https://github.com/Envl/paperoll"

[package.metadata.packager]
product-name = "Paperoll"
identifier = "com.lumik.paperoll"
icons = ["resources/AppIcon.png", "resources/Paperoll.icns"]
license-file = "LICENSE"
category = "DeveloperTool"

[dependencies]
anyhow = "1"
cargo-packager-updater = "0.2.3"
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "a8d1d2650493bbb01eb39412dea823173e1ea94c", features = [
    "tree-sitter-bash",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-csharp",
    "tree-sitter-css",
    "tree-sitter-go",
    "tree-sitter-html",
    "tree-sitter-java",
    "tree-sitter-javascript",
    "tree-sitter-kotlin",
    "tree-sitter-lua",
    "tree-sitter-markdown",
    "tree-sitter-php",
    "tree-sitter-python",
    "tree-sitter-ruby",
    "tree-sitter-rust",
    "tree-sitter-sql",
    "tree-sitter-swift",
    "tree-sitter-toml",
    "tree-sitter-tsx",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
    "tree-sitter-zig",
] }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "a8d1d2650493bbb01eb39412dea823173e1ea94c" }
directories = "6"
dprint-plugin-json = "0.23.0"
dprint-plugin-markdown = "0.23.2"
dprint-plugin-toml = "0.8.0"
dprint-plugin-typescript = "0.96.1"
malva = "0.16.0"
markup_fmt = "0.27.3"
pretty_yaml = "0.6.0"
prettyplease = "0.2.37"
serde_json = "1"
sqlformat = "0.5.0"
syn = { version = "2", features = ["full", "parsing"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
ropey = "=2.0.0-beta.1"

[profile.dev]
debug = "limited"
split-debuginfo = "unpacked"

[profile.dev.package]
gpui = { opt-level = 3 }
gpui_platform = { opt-level = 3 }
ropey = { opt-level = 3 }
tree-sitter = { opt-level = 3 }
